# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Deploy Typescript Node App to EC2

on:
  push:
    branches: ["dev"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            mkdir -p ~/mi-app-node
            cd ~/mi-app-node

            if [ ! -d ".git" ]; then
              git clone https://github.com/Adrian-Garcia-Cuya/authentication-node-ts.git .
            else
              git pull origin dev
            fi

            npm ci --omit=dev

            npm run build

            pm2 delete mi-app-node 2>/dev/null || true

            pm2 start dist/app.js --name "mi-app-node"

            pm2 save

            pm2 status

      - name: Build completed
        run: echo "✅ TypeScript compilation successful"
